<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover (2026-07-27): in the installed app, safe-area
         env() values are ZERO without it — so the bottom tab bar sat inside
         the iPhone home-bar gesture zone (Tony's triple-press jank). With
         cover, every env(safe-area-inset-*) already written in the CSS
         starts actually working. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="manifest" href="/scanner/manifest.json" />
    <title>Liquor Kings Scanner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
